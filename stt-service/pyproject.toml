[project]
name = "stt-service"
version = "0.1.0"
description = "Streaming speech-to-text (faster-whisper) for the vMTB Veritas transcription pipeline"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=12",
    "numpy>=1.26",
    "faster-whisper>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.uv]
package = false