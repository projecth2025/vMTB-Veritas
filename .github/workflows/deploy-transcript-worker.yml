# Deploy transcript-worker (post-meeting MoM worker) to Cloud Run.
#
# Run manually from the GitHub "Actions" tab. Uses Mistral for the
# Minutes-of-Meeting via its OpenAI-compatible API.
#
# Required repository secrets: GCP_PROJECT_ID, GCP_WIF_PROVIDER, GCP_DEPLOY_SA
# Required Secret Manager secrets: supabase-url, supabase-service-role-key,
# llm-api-key (Mistral key), pubsub-push-token. See docs/DEPLOYMENT.md.

name: Deploy transcript-worker

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag (default: git short sha)"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-transcript-worker
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-southeast1
  REPO: vmtb-services
  SERVICE: transcript-worker
  RUNTIME_SA: vmtb-services

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Resolve image tag
        id: tag
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image (Cloud Build)
        run: |
          gcloud builds submit "$SERVICE" \
            --project "$PROJECT_ID" \
            --tag "$REGION-docker.pkg.dev/$PROJECT_ID/$REPO/$SERVICE:${{ steps.tag.outputs.tag }}"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$REGION-docker.pkg.dev/$PROJECT_ID/$REPO/$SERVICE:${{ steps.tag.outputs.tag }}" \
            --service-account "$RUNTIME_SA@$PROJECT_ID.iam.gserviceaccount.com" \
            --no-allow-unauthenticated \
            --min-instances 0 \
            --max-instances 5 \
            --timeout 300 \
            --set-env-vars "GCS_BUCKET=vmtb-transcripts,GCP_PROJECT_ID=$PROJECT_ID,LLM_PROVIDER=mistral,LLM_BASE_URL=https://api.mistral.ai/v1,LLM_MODEL=mistral-small-latest" \
            --set-secrets "SUPABASE_URL=supabase-url:latest,SUPABASE_SERVICE_ROLE_KEY=supabase-service-role-key:latest,LLM_API_KEY=llm-api-key:latest,PUBSUB_PUSH_TOKEN=pubsub-push-token:latest"

      - name: Show service URL
        run: |
          gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --format 'value(status.url)'
