# Deploy opus-transcriber-proxy (JVB -> STT WebSocket proxy) to Cloud Run.
#
# Run manually from the GitHub "Actions" tab. Deploy stt-service FIRST so the
# STT WebSocket URL can be wired in automatically.
#
# Required repository secrets: GCP_PROJECT_ID, GCP_WIF_PROVIDER, GCP_DEPLOY_SA
# See docs/DEPLOYMENT.md.

name: Deploy opus-transcriber-proxy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag (default: git short sha)"
        required: false
        default: ""
      stt_region:
        description: "Region where stt-service is deployed (for STT_WS_URL wiring)"
        required: false
        default: "asia-southeast1"

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-opus-transcriber-proxy
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-southeast1
  REPO: vmtb-services
  SERVICE: opus-transcriber-proxy
  RUNTIME_SA: vmtb-services

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Resolve image tag
        id: tag
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      # Submit asynchronously and poll status: the CI identity cannot stream
      # logs from the default logs bucket (needs project Viewer), which made
      # gcloud exit non-zero even on successful builds.
      - name: Build image (Cloud Build)
        run: |
          set -euo pipefail
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPO/$SERVICE:${{ steps.tag.outputs.tag }}"
          BUILD_ID=$(gcloud builds submit "$SERVICE" \
            --project "$PROJECT_ID" \
            --tag "$IMAGE" \
            --format='value(id)' \
            --async)
          echo "Build id: $BUILD_ID"
          for i in $(seq 1 90); do
            STATUS=$(gcloud builds describe "$BUILD_ID" --project "$PROJECT_ID" --format='value(status)')
            echo "[$i] status: $STATUS"
            case "$STATUS" in
              SUCCESS) exit 0 ;;
              FAILURE|CANCELLED|TIMEOUT|INTERNAL_ERROR)
                echo "::error::Cloud Build $BUILD_ID finished with $STATUS - inspect logs at https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=$PROJECT_ID"
                exit 1 ;;
            esac
            sleep 20
          done
          echo "::error::Timed out waiting for Cloud Build $BUILD_ID"
          exit 1

      # The JVB VM connects to this service over plain WSS and cannot obtain
      # Cloud Run ID tokens, so the service must allow unauthenticated calls.
      # Abuse surface is limited by the sessionId validation + length cap.
      - name: Deploy to Cloud Run
        run: |
          STT_REGION="${{ inputs.stt_region || 'asia-southeast1' }}"
          STT_URL=$(gcloud run services describe stt-service \
            --project "$PROJECT_ID" --region "$STT_REGION" \
            --format 'value(status.url)' 2>/dev/null || true)
          if [ -z "$STT_URL" ]; then
            echo "::warning::stt-service not found in $STT_REGION - deploy it first; continuing with empty STT_WS_URL"
          fi
          STT_WS_URL="${STT_URL/https:/wss:}/client/ws/speech"

          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$REGION-docker.pkg.dev/$PROJECT_ID/$REPO/$SERVICE:${{ steps.tag.outputs.tag }}" \
            --service-account "$RUNTIME_SA@$PROJECT_ID.iam.gserviceaccount.com" \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 10 \
            --timeout 3600 \
            --set-env-vars "PROVIDER=self-hosted,STT_SAMPLE_RATE=16000,STT_CHUNK_MS=60,STT_USE_ID_TOKEN=true,GCP_PROJECT_ID=$PROJECT_ID,PUBSUB_TOPIC=meeting-transcripts,STT_WS_URL=$STT_WS_URL" \
            --set-secrets "SUPABASE_URL=supabase-url:latest,SUPABASE_SERVICE_ROLE_KEY=supabase-service-role-key:latest"

      - name: Show service URL
        run: |
          gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --format 'value(status.url)'
